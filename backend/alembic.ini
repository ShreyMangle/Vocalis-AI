# =============================================================================
# Alembic Configuration
# =============================================================================
#
# CONCEPT: What is Alembic?
# ==========================
# Alembic is a database migration tool for SQLAlchemy.
#
# PROBLEM: Your app is live. Users have data in PostgreSQL.
# You need to add a new column `phone_verified` to the users table.
# If you just change the SQLAlchemy model and restart the app → crash.
# The model says the column exists. The database doesn't have it.
#
# SOLUTION: Alembic migration.
# You run:  alembic revision --autogenerate -m "add phone_verified to users"
# Alembic:  looks at your models, compares to the actual DB, generates SQL.
# You run:  alembic upgrade head
# Alembic:  runs the SQL → column added → app works.
#
# WORKFLOW:
#   1. Change your SQLAlchemy model (e.g., add a column)
#   2. alembic revision --autogenerate -m "description of change"
#      → creates a new file in alembic/versions/
#   3. alembic upgrade head
#      → applies the migration to the database
#   4. If something goes wrong: alembic downgrade -1
#      → reverses the last migration
#
# Each migration file has:
#   - upgrade():   what to do going forward  (add column, create table...)
#   - downgrade(): what to do going backward (drop column, drop table...)
#
# IMPORTANT: NEVER manually edit your database schema.
# ALWAYS use migrations. This ensures:
#   - All environments (dev, staging, prod) have the exact same schema.
#   - Schema changes are tracked in Git history.
#   - Rollbacks are possible.

[alembic]
# Path to migration scripts, relative to this file (alembic.ini is in backend/)
script_location = alembic

# Template for migration file names: timestamp_description.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for migration timestamps
timezone = UTC

# SQLAlchemy URL is set dynamically in env.py from settings
# DO NOT hardcode it here — it would expose credentials in Git
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
